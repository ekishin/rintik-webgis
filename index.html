<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <title>RINTIK - WebGIS UMKM & Analisis Usaha Kota Bogor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-card: #fdfbf7;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --color-kuliner: #e11d48;
            --color-fashion: #ea580c;
            --color-jasa: #0284c7;
            --color-kerajinan: #16a34a;
            --color-tekno: #4f46e5;
            --color-orange-btn: #f97316;
            --border-soft: #e2ded5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #f8fafc; color: var(--text-dark); position: relative; }

        #map { width: 100%; height: 100%; z-index: 1; }

        .leaflet-bottom.leaflet-left { bottom: 25px; left: 20px; }
        .leaflet-control-zoom {
            border: 1px solid var(--border-soft) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
            border-radius: 8px !important;
            overflow: hidden;
        }
        .leaflet-control-zoom a {
            background-color: var(--bg-card) !important;
            color: var(--text-dark) !important;
        }

        /* FLOATING TOP NAVBAR */
        .top-navbar-container {
            position: absolute; top: 14px; left: 16px; right: 16px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 1000; pointer-events: none; gap: 8px;
        }

        .top-left-filters {
            display: flex; align-items: center; gap: 8px; pointer-events: auto; flex-wrap: wrap;
        }

        /* POV SWITCHER */
        .pov-mode-switch {
            display: flex; background: #e2e8f0; padding: 3px; border-radius: 25px; gap: 3px;
        }
        .btn-pov-tab {
            border: none; background: transparent; padding: 6px 14px; border-radius: 20px;
            font-size: 11.5px; font-weight: 700; color: #475569; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .btn-pov-tab.active {
            background: #ffffff; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .search-pill-box {
            display: flex; align-items: center; background: var(--bg-card);
            padding: 8px 14px; border-radius: 30px; border: 1px solid var(--border-soft);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); gap: 10px; width: 250px;
        }
        .search-pill-box input {
            border: none; outline: none; background: transparent; width: 100%;
            font-size: 12px; color: var(--text-dark); font-weight: 500;
        }
        .search-pill-box i { color: #94a3b8; font-size: 13px; }

        .category-pill-group { display: flex; align-items: center; gap: 6px; }
        .cat-pill {
            display: flex; align-items: center; gap: 6px; background: var(--bg-card);
            border: 1px solid var(--border-soft); padding: 7px 14px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.2s;
        }
        .cat-pill:hover { transform: translateY(-1px); }
        .cat-pill.active {
            background: #e11d48; color: #ffffff; border-color: #e11d48;
        }
        .cat-pill.active i { color: #ffffff !important; }

        .select-pill {
            background: var(--bg-card); border: 1px solid var(--border-soft);
            padding: 7px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
            color: var(--text-dark); cursor: pointer; outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .btn-toggle-stat {
            background: var(--bg-card); border: 1px solid var(--border-soft);
            padding: 8px 14px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 6px; pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); color: var(--text-dark);
        }

        /* FLOATING SIDEBAR KIRI */
        .left-floating-card {
            position: absolute; top: 68px; left: 16px; width: 350px; max-height: calc(100vh - 86px);
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-soft);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 1000; display: flex;
            flex-direction: column; overflow: hidden;
        }
        .left-card-body {
            padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
        }
        .left-card-body::-webkit-scrollbar { width: 5px; }
        .left-card-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .list-header-title { font-size: 13px; font-weight: 800; color: #991b1b; }
        .list-header-sub { font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }

        .umkm-item-card {
            background: #ffffff; border: 1px solid #f1ece1; border-radius: 12px; padding: 12px;
            cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; gap: 4px;
        }
        .umkm-item-card:hover { border-color: var(--color-kuliner); transform: translateY(-2px); }
        .item-top-row { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-size: 12.5px; font-weight: 700; color: #0f172a; }
        .item-badge-pill { font-size: 9.5px; font-weight: 700; padding: 3px 8px; border-radius: 12px; color: #fff; }
        .item-desc { font-size: 10.5px; color: var(--text-muted); }
        .item-price-rating { font-size: 10.5px; font-weight: 600; color: #334155; }
        .item-footer-loc { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); margin-top: 4px; }

        .btn-back-link { font-size: 11px; font-weight: 700; color: #b91c1c; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
        .detail-title-large { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .detail-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .detail-section-label { font-size: 9.5px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-top: 6px; }
        .detail-section-val { font-size: 11.5px; color: #334155; font-weight: 500; line-height: 1.4; }
        .detail-action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .btn-orange-rute {
            background: var(--color-orange-btn); color: #fff; border: none; padding: 10px;
            border-radius: 8px; font-size: 11.5px; font-weight: 700; cursor: pointer; text-align: center;
        }
        .btn-white-terdekat {
            background: #ffffff; color: #334155; border: 1px solid var(--border-soft); padding: 10px;
            border-radius: 8px; font-size: 11.5px; font-weight: 700; cursor: pointer; text-align: center;
        }

        .transport-tab {
            background: var(--bg-card); border: 1px solid var(--border-soft);
            padding: 6px 12px; border-radius: 18px; font-size: 11px; font-weight: 600;
            color: #475569; cursor: pointer; display: flex; align-items: center; gap: 5px;
            transition: all 0.2s;
        }
        .transport-tab.active {
            background: #fde047 !important; color: #854d0e !important;
            border-color: #facc15 !important; font-weight: 700;
        }

        /* STATISTIK SIDEBAR KANAN */
        .right-stat-card {
            position: absolute; top: 68px; right: 16px; width: 310px; max-height: calc(100vh - 86px);
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-soft);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 1000; display: flex;
            flex-direction: column; overflow: hidden; padding: 16px; gap: 10px;
        }
        .stat-header { display: flex; justify-content: space-between; align-items: center; }
        .stat-header h3 { font-size: 13px; font-weight: 800; }
        .stat-big-number { font-size: 24px; font-weight: 900; color: #b91c1c; display: flex; align-items: baseline; gap: 6px; }
        .stat-big-number span { font-size: 11px; font-weight: 600; color: #64748b; }
        .stat-bar-group { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
        .stat-bar-item { display: flex; flex-direction: column; gap: 2px; }
        .stat-bar-label { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 600; color: #334155; }
        .stat-progress-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .stat-progress-fill { height: 100%; border-radius: 4px; }

        /* LAYER CONTROL KANAN BAWAH */
        .bottom-layer-panel {
            position: absolute; bottom: 20px; right: 20px; background: var(--bg-card);
            border-radius: 14px; border: 1px solid var(--border-soft); padding: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); z-index: 999; width: 230px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .layer-item-checkbox { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; color: #334155; cursor: pointer; }
        .layer-item-checkbox input { accent-color: #ea580c; width: 15px; height: 15px; cursor: pointer; }

        .score-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 52px; height: 52px; border-radius: 50%; font-size: 18px; font-weight: 800;
            color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .competitor-list-item {
            background: #fff; border: 1px solid #fee2e2; border-left: 3px solid #dc2626;
            border-radius: 6px; padding: 6px 8px; font-size: 11px; margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- TOP FLOATING NAVBAR -->
    <div class="top-navbar-container">
        <div class="top-left-filters">
            <!-- Mode Switcher -->
            <div class="pov-mode-switch">
                <button class="btn-pov-tab active" id="tabModePengunjung" onclick="gantiModePOV('pengunjung')">
                    <i class="fa-solid fa-compass"></i> Pengunjung
                </button>
                <button class="btn-pov-tab" id="tabModePengusaha" onclick="gantiModePOV('pengusaha')">
                    <i class="fa-solid fa-briefcase"></i> Analisis Peluang Usaha
                </button>
            </div>

            <!-- Search box Pengunjung -->
            <div class="search-pill-box" id="searchBoxContainer">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="mainSearchInput" placeholder="Cari UMKM, produk, kelurahan..." onkeyup="filterSemuaData()">
            </div>

            <!-- Kategori Pengunjung -->
            <div class="category-pill-group" id="categoryPillGroup">
                <div class="cat-pill" onclick="pilihKategori('Fashion', this)"><i class="fa-solid fa-shirt" style="color:#ea580c;"></i> Fashion</div>
                <div class="cat-pill" onclick="pilihKategori('Kuliner', this)"><i class="fa-solid fa-utensils" style="color:#e11d48;"></i> Kuliner</div>
                <div class="cat-pill" onclick="pilihKategori('Jasa', this)"><i class="fa-solid fa-scissors" style="color:#0284c7;"></i> Jasa</div>
                <div class="cat-pill" onclick="pilihKategori('Kerajinan', this)"><i class="fa-solid fa-leaf" style="color:#16a34a;"></i> Kerajinan</div>
                <div class="cat-pill" onclick="pilihKategori('Teknologi', this)"><i class="fa-solid fa-laptop" style="color:#4f46e5;"></i> Teknologi</div>
            </div>

            <!-- Dropdown Kecamatan & Kelurahan -->
            <select id="kecamatanSelect" class="select-pill" onchange="onKecamatanChange()">
                <option value="Semua" selected>Semua Kecamatan</option>
                <option value="Bogor Barat">Bogor Barat</option>
                <option value="Bogor Selatan">Bogor Selatan</option>
                <option value="Bogor Tengah">Bogor Tengah</option>
                <option value="Bogor Timur">Bogor Timur</option>
                <option value="Bogor Utara">Bogor Utara</option>
                <option value="Tanah Sareal">Tanah Sareal</option>
            </select>

            <select id="kelurahanSelect" class="select-pill" onchange="onKelurahanChange()">
                <option value="Semua" selected>Semua Kelurahan</option>
            </select>

            <select id="radiusSelect" class="select-pill" onchange="filterSemuaData()">
                <option value="0" selected>Radius (Semua)</option>
                <option value="1">1 KM</option>
                <option value="3">3 KM</option>
                <option value="5">5 KM</option>
            </select>
        </div>

        <button class="btn-toggle-stat" onclick="toggleStatistik()">
            <i class="fa-solid fa-chart-simple"></i> Statistik
        </button>
    </div>

    <!-- LEFT FLOATING SIDEBAR -->
    <div class="left-floating-card" id="leftCardContainer">
        <div class="left-card-body" id="leftCardBody"></div>
    </div>

    <!-- RIGHT FLOATING PANEL STATISTIK -->
    <div class="right-stat-card" id="rightStatCard">
        <div class="stat-header">
            <h3>Statistik persebaran</h3>
            <i class="fa-solid fa-xmark" style="cursor:pointer; color:#94a3b8;" onclick="toggleStatistik()"></i>
        </div>
        <div class="stat-big-number">
            <span id="statSelectedTotal">0</span>
            <span>UMKM &bull; <b id="statAreaName">Kota Bogor</b></span>
        </div>

        <div style="font-size:9.5px; font-weight:800; color:#94a3b8; text-transform:uppercase; margin-top:8px;">DISTRIBUSI KATEGORI</div>
        <div class="stat-bar-group" id="statCategoryBars"></div>
    </div>

    <!-- LAYER CONTROL KANAN BAWAH -->
    <div class="bottom-layer-panel">
        <div style="font-size:12px; font-weight:800; margin-bottom:4px;">Layer peta</div>
        <label class="layer-item-checkbox">
            <input type="checkbox" id="layerUmkm" checked onchange="toggleMapLayer('umkm')"> Titik UMKM
        </label>
        <label class="layer-item-checkbox">
            <input type="checkbox" id="layerAdmin" checked onchange="toggleMapLayer('admin')"> Batas Administrasi Kota
        </label>
        <label class="layer-item-checkbox">
            <input type="checkbox" id="layerJalan" onchange="toggleMapLayer('jalan')"> Jaringan Jalan
        </label>
        <label class="layer-item-checkbox">
            <input type="checkbox" id="layerSekolah" checked onchange="toggleMapLayer('sekolah')"> Sekolah & Kampus
        </label>
        <label class="layer-item-checkbox">
            <input type="checkbox" id="layerPermukiman" onchange="toggleMapLayer('permukiman')"> Zona Permukiman
        </label>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // INISIALISASI PETA
        const map = L.map('map', {
            center: [-6.5950, 106.7900],
            zoom: 13,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC'
        }).addTo(map);

        // STATE SISTEM
        let activePOV = 'pengunjung';
        let rawUmkmData = [];
        let filteredUmkmData = [];
        let rawAdminData = null;
        let activeKategori = 'Semua';
        let userLocation = [-6.5950, 106.7900];
        let userMarker = null;
        let routePolyline = null;
        let singleTargetMarker = null;
        let currentActiveItem = null;
        let activeTransportMode = 'motor';
        let currentRouteDistanceKm = 0;
        let navigationInterval = null;

        // LAYER GROUPS
        let umkmLayerGroup = L.layerGroup().addTo(map);
        let adminBoundaryLayer = null;
        let highlightBoundaryLayer = L.layerGroup().addTo(map);
        let jalanLayer = L.layerGroup();
        let sekolahLayer = L.layerGroup().addTo(map);
        let permukimanLayer = L.layerGroup();
        let analisisBufferLayer = null;
        let candidateMarker = null;
        let competitorMarkersGroup = L.layerGroup().addTo(map);

        let sekolahData = [];
        let jalanData = [];
        let permukimanData = [];

        function createCustomPin(color) {
            return L.divIcon({
                className: 'custom-map-pin',
                html: `
                    <svg width="24" height="30" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C5.37258 0 0 5.37258 0 12C0 21 12 32 12 32C12 32 24 21 24 12C24 5.37258 18.6274 0 12 0Z" fill="${color}"/>
                        <circle cx="12" cy="12" r="4" fill="#ffffff"/>
                    </svg>
                `,
                iconSize: [24, 30],
                iconAnchor: [12, 30],
                popupAnchor: [0, -28]
            });
        }

        function createSchoolPin() {
            return L.divIcon({
                className: 'school-map-pin',
                html: `
                    <div style="background:#059669; color:#fff; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.25); font-size:11px;">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                `,
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                popupAnchor: [0, -12]
            });
        }

        function getWarnaKategori(kat) {
            kat = (kat || '').toLowerCase();
            if (kat.includes('kuliner') || kat.includes('makan') || kat.includes('minum')) return '#e11d48';
            if (kat.includes('fashion') || kat.includes('pakaian')) return '#ea580c';
            if (kat.includes('jasa')) return '#0284c7';
            if (kat.includes('kerajinan') || kat.includes('rajin')) return '#16a34a';
            if (kat.includes('tekno') || kat.includes('digital')) return '#4f46e5';
            return '#f59e0b';
        }

        function hitungJarakKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(2);
        }

        // 1. LOAD POLIGON BATAS ADMINISTRASI KOTA BOGOR (OUTER BOUNDARY)
        const pathAdmin = [
            'data/bogor_administrasi.geojson',
            'bogor_administrasi.geojson',
            'data/administrasi_bogor.geojson'
        ];

        function muatBatasAdministrasi(idx = 0) {
            if (idx >= pathAdmin.length) return;
            fetch(pathAdmin[idx])
                .then(res => res.json())
                .then(data => {
                    rawAdminData = data;
                    if (adminBoundaryLayer) map.removeLayer(adminBoundaryLayer);

                    // Garis Luar Pembatas Wilayah Kota Bogor
                    adminBoundaryLayer = L.geoJSON(data, {
                        style: function() {
                            return {
                                color: '#1e293b',       // Garis hitam pekat pembatas kota
                                weight: 3.5,            // Garis tebal memisahkan dari Kabupaten sekitar
                                opacity: 0.9,
                                fillColor: '#38bdf8',
                                fillOpacity: 0.04
                            };
                        },
                        interactive: false
                    }).addTo(map);
                    adminBoundaryLayer.bringToBack();
                })
                .catch(() => muatBatasAdministrasi(idx + 1));
        }
        muatBatasAdministrasi();

        // 2. FUNGSI UNTUK HIGHLIGHT POLIGON DENGAN LINE BIRU (KECAMATAN / KELURAHAN)
        function updateHighlightPoligon(kecamatan, kelurahan) {
            highlightBoundaryLayer.clearLayers();
            if (!rawAdminData || !rawAdminData.features) return;

            if (kecamatan === 'Semua' && kelurahan === 'Semua') {
                if (adminBoundaryLayer) {
                    map.fitBounds(adminBoundaryLayer.getBounds(), { padding: [20, 20] });
                }
                return;
            }

            const matchingFeatures = rawAdminData.features.filter(f => {
                const p = f.properties || {};
                const fKec = (p.WADMKC || p.KECAMATAN || p.kecamatan || p.Kecamatan || p.NAMOBJ || '').trim().toLowerCase();
                const fKel = (p.WADMKD || p.KELURAHAN || p.kelurahan || p.Kelurahan || p.DESA || p.desa || '').trim().toLowerCase();

                const matchKec = (kecamatan === 'Semua') || fKec.includes(kecamatan.toLowerCase());
                const matchKel = (kelurahan === 'Semua') || fKel.includes(kelurahan.toLowerCase());

                if (kelurahan !== 'Semua') return matchKel;
                if (kecamatan !== 'Semua') return matchKec;
                return false;
            });

            if (matchingFeatures.length > 0) {
                const highlightGeoJson = L.geoJSON({
                    type: "FeatureCollection",
                    features: matchingFeatures
                }, {
                    style: {
                        color: '#0284c7',        // Garis tepi biru tegas
                        weight: 4,              // Garis tepi tebal
                        opacity: 1,
                        fillColor: '#38bdf8',    // Warna isian biru muda
                        fillOpacity: 0.25,      // Arsiran poligon
                        dashArray: '4, 4'
                    },
                    interactive: false
                });

                highlightBoundaryLayer.addLayer(highlightGeoJson);
                highlightGeoJson.bringToFront();

                map.fitBounds(highlightGeoJson.getBounds(), {
                    padding: [40, 40],
                    maxZoom: 16,
                    animate: true,
                    duration: 1.2
                });
            }
        }

        // 3. LOAD DATA UMKM
        function loadDataUMKM() {
            const filePaths = [
                'data/master_umkm_final_update.geojson',
                'master_umkm_final_update.geojson',
                'data/umkm_bogor.geojson'
            ];

            function cobaAmbil(idx) {
                if (idx >= filePaths.length) return;
                fetch(filePaths[idx])
                    .then(r => r.json())
                    .then(geojsonData => {
                        rawUmkmData = geojsonData.features || [];
                        populateKelurahanOptions(rawUmkmData);
                        filterSemuaData();
                    })
                    .catch(() => cobaAmbil(idx + 1));
            }
            cobaAmbil(0);
        }
        loadDataUMKM();

        // 4. LOAD DATASET PENDUKUNG
        function muatLayerPendukung() {
            fetch('data/sekolah_kota.geojson')
                .then(r => r.json())
                .then(data => {
                    sekolahData = data.features || [];
                    sekolahLayer.clearLayers();
                    data.features.forEach(f => {
                        if (!f.geometry || !f.geometry.coordinates) return;
                        const coords = f.geometry.coordinates;
                        const p = f.properties || {};
                        const namaSekolah = p.nama || p.nama_sekolah || p.name || 'Fasilitas Pendidikan / Kampus';
                        const jenjang = p.tingkat || p.jenjang || p.kategori || 'Sekolah / Kampus';

                        const marker = L.marker([coords[1], coords[0]], { icon: createSchoolPin() });
                        marker.bindPopup(`
                            <div style="font-size:12px; padding:2px;">
                                <div style="font-size:10px; font-weight:800; color:#059669; text-transform:uppercase;">
                                    <i class="fa-solid fa-graduation-cap"></i> ${jenjang}
                                </div>
                                <div style="font-weight:700; color:#0f172a; margin-top:2px;">${namaSekolah}</div>
                                <div style="font-size:10px; color:#64748b; margin-top:2px;">Potensi Pasar Pelajar/Mahasiswa</div>
                            </div>
                        `);
                        sekolahLayer.addLayer(marker);
                    });
                }).catch(() => {});

            fetch('data/pemukiman.geojson')
                .then(r => r.json())
                .then(data => {
                    permukimanData = data.features || [];
                    L.geoJSON(data, {
                        style: { color: '#ca8a04', weight: 1, fillOpacity: 0.15 }
                    }).addTo(permukimanLayer);
                }).catch(() => {});

            fetch('data/jalan_kota.geojson')
                .then(r => r.json())
                .then(data => {
                    jalanData = data.features || [];
                    L.geoJSON(data, {
                        style: { color: '#64748b', weight: 2, opacity: 0.7 }
                    }).addTo(jalanLayer);
                }).catch(() => {});
        }
        muatLayerPendukung();

        // 5. DETEKSI LOKASI PENGGUNA
        function deteksiLokasiPengguna() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLocation = [pos.coords.latitude, pos.coords.longitude];
                        if (userMarker) userMarker.setLatLng(userLocation);
                        else {
                            userMarker = L.circleMarker(userLocation, {
                                radius: 8, fillColor: '#2563eb', color: '#ffffff', weight: 2.5, fillOpacity: 1
                            }).addTo(map).bindPopup("<b>Lokasi Anda Saat Ini</b>");
                        }
                        if (activePOV === 'pengunjung') filterSemuaData();
                    },
                    () => {
                        if (!userMarker) {
                            userMarker = L.circleMarker(userLocation, {
                                radius: 7, fillColor: '#2563eb', color: '#ffffff', weight: 2, fillOpacity: 0.95
                            }).addTo(map).bindPopup("<b>Titik Acuan (Kota Bogor)</b>");
                        }
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }
        deteksiLokasiPengguna();

        function populateKelurahanOptions(features) {
            const kecTerpilih = (document.getElementById('kecamatanSelect').value || 'Semua').toLowerCase();
            const kelSet = new Set();

            features.forEach(f => {
                const p = f.properties || {};
                const k = p.kelurahan || p.desa;
                const kc = (p.kecamatan || '').toLowerCase();
                if (k && (kecTerpilih === 'semua' || kc.includes(kecTerpilih))) {
                    kelSet.add(k.trim());
                }
            });

            const sel = document.getElementById('kelurahanSelect');
            sel.innerHTML = '<option value="Semua">Semua Kelurahan</option>';
            Array.from(kelSet).sort().forEach(kel => {
                const opt = document.createElement('option');
                opt.value = kel; opt.textContent = kel;
                sel.appendChild(opt);
            });
        }

        function onKecamatanChange() {
            const kecKey = document.getElementById('kecamatanSelect').value;
            const kelKey = 'Semua';
            document.getElementById('kelurahanSelect').value = 'Semua';
            populateKelurahanOptions(rawUmkmData);

            updateHighlightPoligon(kecKey, kelKey);

            if (activePOV === 'pengunjung') {
                filterSemuaData();
            } else {
                bersihkanAnalisisSpasial();
                renderMarkers();
            }
            renderStatistik();
        }

        function onKelurahanChange() {
            const kecKey = document.getElementById('kecamatanSelect').value;
            const kelKey = document.getElementById('kelurahanSelect').value;

            updateHighlightPoligon(kecKey, kelKey);

            if (activePOV === 'pengunjung') {
                filterSemuaData();
            } else {
                bersihkanAnalisisSpasial();
                renderMarkers();
            }
            renderStatistik();
        }

        function pilihKategori(kat, el) {
            if (activeKategori.toLowerCase() === kat.toLowerCase()) {
                activeKategori = 'Semua';
                el.classList.remove('active');
            } else {
                document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
                activeKategori = kat;
                el.classList.add('active');
            }
            filterSemuaData();
        }

        function gantiModePOV(mode) {
            activePOV = mode;
            document.getElementById('tabModePengunjung').classList.toggle('active', mode === 'pengunjung');
            document.getElementById('tabModePengusaha').classList.toggle('active', mode === 'pengusaha');

            bersihkanAnalisisSpasial();
            if (routePolyline) hapusRuteNavigasi();

            const searchBox = document.getElementById('searchBoxContainer');
            const catPills = document.getElementById('categoryPillGroup');
            const radiusSel = document.getElementById('radiusSelect');

            if (mode === 'pengusaha') {
                searchBox.style.display = 'none';
                radiusSel.style.display = 'none';
                catPills.style.display = 'none';

                document.getElementById('layerSekolah').checked = true;
                map.addLayer(sekolahLayer);

                renderMarkers();
                renderModePengusahaIntro();
            } else {
                searchBox.style.display = 'flex';
                radiusSel.style.display = 'inline-block';
                catPills.style.display = 'flex';

                renderMarkers();
                renderListView();
            }
        }

        function bersihkanAnalisisSpasial() {
            if (analisisBufferLayer) { map.removeLayer(analisisBufferLayer); analisisBufferLayer = null; }
            if (candidateMarker) { map.removeLayer(candidateMarker); candidateMarker = null; }
            competitorMarkersGroup.clearLayers();
        }

        function filterSemuaData() {
            if (activePOV !== 'pengunjung') return;

            const searchKey = (document.getElementById('mainSearchInput').value || '').toLowerCase().trim();
            const kecKey = (document.getElementById('kecamatanSelect').value || 'Semua').trim();
            const kelKey = (document.getElementById('kelurahanSelect').value || 'Semua').trim();
            const maxRadius = parseFloat(document.getElementById('radiusSelect').value || '0');

            filteredUmkmData = rawUmkmData.filter(feature => {
                const props = feature.properties || {};
                const nama = (props.nama_umkm || props.nama || '').toLowerCase();
                const desc = (props.deskripsi_produk || props.deskripsi || '').toLowerCase();
                const kec = (props.kecamatan || '').trim().toLowerCase();
                const kel = (props.kelurahan || props.desa || '').trim().toLowerCase();
                const kat = (props.kategori || '').trim().toLowerCase();
                const coords = feature.geometry ? feature.geometry.coordinates : null;

                const matchNama = !searchKey || nama.includes(searchKey) || desc.includes(searchKey) || kel.includes(searchKey);
                const matchKec = (kecKey === 'Semua') || kec.includes(kecKey.toLowerCase());
                const matchKel = (kelKey === 'Semua') || kel.includes(kelKey.toLowerCase());
                const matchKat = (activeKategori === 'Semua') || kat.includes(activeKategori.toLowerCase());

                let matchRadius = true;
                if (maxRadius > 0 && coords) {
                    const dist = hitungJarakKm(userLocation[0], userLocation[1], coords[1], coords[0]);
                    matchRadius = parseFloat(dist) <= maxRadius;
                }

                return matchNama && matchKec && matchKel && matchKat && matchRadius;
            });

            filteredUmkmData.forEach(f => {
                if (f.geometry && f.geometry.coordinates) {
                    f.distanceToUser = hitungJarakKm(userLocation[0], userLocation[1], f.geometry.coordinates[1], f.geometry.coordinates[0]);
                } else {
                    f.distanceToUser = 999;
                }
            });
            filteredUmkmData.sort((a, b) => a.distanceToUser - b.distanceToUser);

            renderMarkers();

            if (filteredUmkmData.length === 0) renderNoResultView();
            else renderListView();

            renderStatistik();
        }

        function renderMarkers() {
            if (singleTargetMarker) {
                map.removeLayer(singleTargetMarker);
                singleTargetMarker = null;
            }

            umkmLayerGroup.clearLayers();
            const dataset = (activePOV === 'pengunjung') ? filteredUmkmData : rawUmkmData;

            dataset.forEach(item => {
                if (!item.geometry || !item.geometry.coordinates) return;
                const coords = item.geometry.coordinates;
                const props = item.properties || {};
                const marker = L.marker([coords[1], coords[0]], {
                    icon: createCustomPin(getWarnaKategori(props.kategori))
                });
                marker.on('click', () => {
                    if (activePOV === 'pengunjung') renderDetailView(item);
                });
                umkmLayerGroup.addLayer(marker);
            });
        }

        map.on('click', (e) => {
            if (activePOV !== 'pengusaha') return;

        function jalankanAnalisisPeluangUsaha(lat, lng) {
            const kategoriInput = document.getElementById('kategoriRencanaUsaha') 
                ? document.getElementById('kategoriRencanaUsaha').value 
                : 'Kuliner';
            const produkInput = document.getElementById('produkRencanaUsaha') 
                ? document.getElementById('produkRencanaUsaha').value.trim().toLowerCase() 
                : '';

            umkmLayerGroup.clearLayers();
            competitorMarkersGroup.clearLayers();

            if (candidateMarker) map.removeLayer(candidateMarker);
            candidateMarker = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: 'custom-cand-pin',
                    html: `<div style="background:#0f172a; color:#fff; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 3px 10px rgba(0,0,0,0.3); font-size:14px;"><i class="fa-solid fa-shop"></i></div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                })
            }).addTo(map).bindPopup(`<b>Rencana Titik Usaha Baru</b><br>${produkInput ? 'Produk: ' + produkInput : 'Kategori: ' + kategoriInput}`).openPopup();

            if (analisisBufferLayer) map.removeLayer(analisisBufferLayer);
            analisisBufferLayer = L.circle([lat, lng], {
                radius: 500,
                color: '#3b82f6',
                fillColor: '#60a5fa',
                fillOpacity: 0.15,
                weight: 2,
                dashArray: '5, 5'
            }).addTo(map);

            map.panTo([lat, lng]);

            let kompetitorDitemukan = [];
            rawUmkmData.forEach(item => {
                if (!item.geometry || !item.geometry.coordinates) return;
                const coords = item.geometry.coordinates;
                const p = item.properties || {};
                const dist = hitungJarakKm(lat, lng, coords[1], coords[0]);

                if (parseFloat(dist) <= 0.5) {
                    const nama = (p.nama_umkm || p.nama || '').toLowerCase();
                    const desc = (p.deskripsi_produk || p.deskripsi || '').toLowerCase();
                    const kat = (p.kategori || '').toLowerCase();

                    const matchKategori = kat.includes(kategoriInput.toLowerCase());
                    const matchProduk = !produkInput || nama.includes(produkInput) || desc.includes(produkInput);

                    if (matchKategori && matchProduk) {
                        kompetitorDitemukan.push({
                            nama: p.nama_umkm || p.nama,
                            produk: p.deskripsi_produk || p.deskripsi || '-',
                            jarak: (parseFloat(dist) * 1000).toFixed(0),
                            coords: [coords[1], coords[0]]
                        });

                        const compMarker = L.marker([coords[1], coords[0]], {
                            icon: createCustomPin('#dc2626')
                        });
                        compMarker.bindPopup(`
                            <div style="font-size:11px;">
                                <span style="background:#fee2e2; color:#b91c1c; font-weight:800; padding:2px 6px; border-radius:4px; font-size:9.5px;">KOMPETITOR</span>
                                <div style="font-weight:700; color:#0f172a; margin-top:3px;">${p.nama_umkm || p.nama}</div>
                                <div style="color:#64748b; font-size:10px;">${p.deskripsi_produk || p.deskripsi || '-'}</div>
                                <div style="color:#dc2626; font-weight:700; margin-top:2px;">&plusmn; ${(parseFloat(dist) * 1000).toFixed(0)} meter dari rencana Anda</div>
                            </div>
                        `);
                        competitorMarkersGroup.addLayer(compMarker);
                    }
                }
            });

            let sekolahTerdekat = null;
            let minJarakSekolah = 999;
            sekolahData.forEach(s => {
                if (!s.geometry || !s.geometry.coordinates) return;
                const coords = s.geometry.coordinates;
                const dist = parseFloat(hitungJarakKm(lat, lng, coords[1], coords[0]));
                if (dist < minJarakSekolah) {
                    minJarakSekolah = dist;
                    const p = s.properties || {};
                    sekolahTerdekat = {
                        nama: p.nama || p.nama_sekolah || p.name || 'Fasilitas Pendidikan',
                        jarakM: (dist * 1000).toFixed(0)
                    };
                }
            });

            let skor = 50;
            const jumlahComp = kompetitorDitemukan.length;

            if (jumlahComp === 0) skor += 35;
            else if (jumlahComp === 1) skor += 20;
            else if (jumlahComp <= 3) skor += 5;
            else skor -= 25;

            if (minJarakSekolah < 0.4) skor += 15;
            else if (minJarakSekolah < 1.0) skor += 10;

            skor = Math.min(100, Math.max(10, skor));

            let gradeWarna = '#16a34a';
            let gradeLabel = 'Sangat Berpotensi';
            if (skor < 50) { gradeWarna = '#dc2626'; gradeLabel = 'Kurang Disarankan'; }
            else if (skor < 75) { gradeWarna = '#f59e0b'; gradeLabel = 'Potensi Sedang'; }

            let listKompetitorHtml = '';
            if (kompetitorDitemukan.length > 0) {
                kompetitorDitemukan.forEach((k, idx) => {
                    listKompetitorHtml += `
                        <div class="competitor-list-item">
                            <b>${idx + 1}. ${k.nama}</b> (${k.jarak} m)
                            <div style="color:#64748b; font-size:10px;">${k.produk}</div>
                        </div>
                    `;
                });
            } else {
                listKompetitorHtml = `<div style="font-size:11px; color:#16a34a;"><i class="fa-solid fa-check"></i> Tidak ada kompetitor sejenis terdeteksi dalam radius 500 m.</div>`;
            }

            const container = document.getElementById('leftCardBody');
            container.innerHTML = `
                <div class="btn-back-link" onclick="renderModePengusahaIntro()">
                    <i class="fa-solid fa-angle-left"></i> Ganti Analisis

                <div style="display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--border-soft); padding:12px; border-radius:12px;">
                    <div>
                        <div style="font-size:10px; font-weight:800; color:#94a3b8; text-transform:uppercase;">Skor Peluang Lokasi</div>
                        <div style="font-size:16px; font-weight:800; color:${gradeWarna}; margin-top:2px;">${gradeLabel}</div>
                    </div>
                    <div class="score-badge" style="background:${gradeWarna};">${skor}%</div>
                </div>

                <div style="background:#ffffff; border:1px solid var(--border-soft); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px;">
                    <div style="font-size:11px; font-weight:800; color:#0f172a;">
                        Target: ${kategoriInput} ${produkInput ? '(' + produkInput + ')' : ''}
                    </div>

                    <div style="font-size:11px; border-bottom:1px solid #f1f5f9; padding-bottom:6px;">
                        <span style="color:#64748b;">Sekolah / Kampus Terdekat:</span><br>
                        <b><i class="fa-solid fa-graduation-cap" style="color:#059669;"></i> ${sekolahTerdekat ? sekolahTerdekat.nama + ' (' + sekolahTerdekat.jarakM + ' m)' : 'Tidak terdata (< 1 km)'}</b>
                    </div>

                    <div style="font-size:11px;">
                        <span style="color:#64748b;">Kompetitor dalam 500 m (${kompetitorDitemukan.length} toko):</span>
                        <div style="max-height:120px; overflow-y:auto; margin-top:6px;">
                            ${listKompetitorHtml}
                        </div>
                    </div>
                </div>

                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; font-size:10.5px; color:#475569; line-height:1.4;">
                    <i class="fa-solid fa-lightbulb" style="color:#f59e0b;"></i> <b>Rekomendasi Sistem:</b><br>
                    ${jumlahComp > 2 
                        ? `Wilayah ini sudah memiliki <b>${jumlahComp} penjual ${produkInput || kategoriInput}</b>. Persaingan tinggi, pertimbangkan mencari ruko di jalan alternatif atau buat produk diferensiasi.` 
                        : `Persaingan produk <b>${produkInput || kategoriInput}</b> di radius ini masih rendah. Peluang pasar sangat terbuka lebar.`}
                </div>

                <div class="detail-action-buttons">
                    <button class="btn-orange-rute" onclick="renderModePengusahaIntro()">Pilih Titik Lain</button>
                    <button class="btn-white-terdekat" onclick="gantiModePOV('pengunjung')">Mode Pengunjung</button>
                </div>
            `;
        }

                <div class="detail-section-val">${coords[1].toFixed(6)}; ${coords[0].toFixed(6)}</div>

                <div class="detail-action-buttons">
                    <button class="btn-orange-rute" onclick='buatRuteJalanNyata(${JSON.stringify(item)})'>Rute ke sini</button>
                    <button class="btn-white-terdekat" onclick="renderListView()">Kembali</button>
                </div>
            `;
        }

        function buatRuteJalanNyata(item) {
            currentActiveItem = item;
            const props = item.properties || {};
            const destLng = item.geometry.coordinates[0];
            const destLat = item.geometry.coordinates[1];
            const startLat = userLocation[0];
            const startLng = userLocation[1];

            umkmLayerGroup.clearLayers();

            if (singleTargetMarker) map.removeLayer(singleTargetMarker);
            singleTargetMarker = L.marker([destLat, destLng], {
                icon: createCustomPin(getWarnaKategori(props.kategori))
            }).addTo(map).bindPopup(`<b>${props.nama_umkm || props.nama}</b><br>Titik Tujuan Rute`).openPopup();

            const container = document.getElementById('leftCardBody');
            container.innerHTML = `
                <div style="padding: 20px; text-align: center; color: #64748b; font-size: 12px;">
                    <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: #ea580c; margin-bottom: 10px;"></i>
                    <br>Menghitung rute jalan ke <b>${props.nama_umkm || props.nama}</b>...
                </div>
            `;

            const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${destLng},${destLat}?overview=full&geometries=geojson`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (!data.routes || data.routes.length === 0) {
                        buatGarisLurusFallback(startLat, startLng, destLat, destLng, item);
                        return;
                    }

                    const route = data.routes[0];
                    currentRouteDistanceKm = parseFloat((route.distance / 1000).toFixed(1));
                    const coordsRoute = route.geometry.coordinates.map(c => [c[1], c[0]]);

                    if (routePolyline) map.removeLayer(routePolyline);
                    routePolyline = L.polyline(coordsRoute, {
                        color: '#dc2626', weight: 5, opacity: 0.9, lineJoin: 'round', lineCap: 'round'
                    }).addTo(map);

                    map.fitBounds(routePolyline.getBounds(), { padding: [60, 60] });
                    tampilkanPanelRuteNavigasi();
                })
                .catch(() => {
                    buatGarisLurusFallback(startLat, startLng, destLat, destLng, item);
                });
        }

        function hitungDurasiMenit(jarakKm, mode) {
            let durasi = 0;
            if (mode === 'motor') durasi = Math.ceil((jarakKm / 30) * 60) + 1;
            else if (mode === 'mobil') durasi = Math.ceil((jarakKm / 22) * 60) + 2;
            else if (mode === 'jalan') durasi = Math.ceil((jarakKm / 4.8) * 60);
            return Math.max(1, durasi);
        }

        function tampilkanPanelRuteNavigasi() {
            if (!currentActiveItem) return;
            const props = currentActiveItem.properties || {};
            const durasiMnt = hitungDurasiMenit(currentRouteDistanceKm, activeTransportMode);

            const container = document.getElementById('leftCardBody');
            container.innerHTML = `
                <div class="btn-back-link" onclick='hapusRuteDanBukaDetail(currentActiveItem)'>
                    <i class="fa-solid fa-angle-left"></i> Detail UMKM
                </div>

                <div style="font-size:15px; font-weight:800; color:#0f172a; margin-bottom:8px;">
                    Rute ke ${props.nama_umkm || props.nama}
                </div>

                <div style="background:#ffffff; border:1px solid #f1ece1; border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px;">
                    <div style="font-size:11px; display:flex; align-items:center; gap:8px;">
                        <span style="width:9px; height:9px; border-radius:50%; background:#2563eb; display:inline-block;"></span>
                        <span><b>Titik awal:</b> Lokasi Anda</span>
                    </div>
                    <div style="font-size:11px; display:flex; align-items:center; gap:8px;">
                        <span style="width:9px; height:9px; border-radius:50%; background:#dc2626; display:inline-block;"></span>
                        <span><b>Tujuan:</b> ${props.nama_umkm || props.nama}</span>
                    </div>
                </div>

                <div style="display:flex; gap:6px; margin-top:8px;">
                    <button class="transport-tab ${activeTransportMode === 'motor' ? 'active' : ''}" onclick="gantiModaTransportasi('motor')">
                        <i class="fa-solid fa-motorcycle"></i> Motor
                    </button>
                    <button class="transport-tab ${activeTransportMode === 'mobil' ? 'active' : ''}" onclick="gantiModaTransportasi('mobil')">
                        <i class="fa-solid fa-car"></i> Mobil
                    </button>
                    <button class="transport-tab ${activeTransportMode === 'jalan' ? 'active' : ''}" onclick="gantiModaTransportasi('jalan')">
                        <i class="fa-solid fa-person-walking"></i> Jalan kaki
                    </button>
                </div>

                <div style="background:#ffffff; border:1px solid #f1ece1; border-radius:10px; padding:12px; margin-top:8px;">
                    <div style="font-size:18px; font-weight:800; color:#0f172a;">
                        &plusmn; ${currentRouteDistanceKm} km &bull; ${durasiMnt} mnt
                    </div>
                    <div style="font-size:10px; color:#64748b; margin-top:2px;">
                        Estimasi waktu perjalanan (${activeTransportMode === 'motor' ? 'Sepeda Motor' : activeTransportMode === 'mobil' ? 'Mobil' : 'Jalan Kaki'}).
                    </div>
                </div>

                <div class="detail-action-buttons" style="margin-top:10px;">
                    <button class="btn-orange-rute" onclick="mulaiNavigasiRute()">Mulai rute</button>
                    <button class="btn-white-terdekat" onclick="hapusRuteNavigasi()">Tutup rute</button>
                </div>
            `;
        }

        function gantiModaTransportasi(mode) {
            activeTransportMode = mode;
            tampilkanPanelRuteNavigasi();
        }

        function mulaiNavigasiRute() {
            if (!currentActiveItem) return;
            const props = currentActiveItem.properties || {};
            const durasiMnt = hitungDurasiMenit(currentRouteDistanceKm, activeTransportMode);

            map.flyTo(userLocation, 18, { animate: true, duration: 1.5 });

            const container = document.getElementById('leftCardBody');
            container.innerHTML = `
                <div style="background: #16a34a; color: #ffffff; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-location-arrow fa-2x"></i>
                    <div>
                        <div style="font-size: 11px; text-transform: uppercase; font-weight: 700; opacity: 0.9;">Navigasi Aktif</div>
                        <div style="font-size: 14px; font-weight: 800;">Menuju ${props.nama_umkm || props.nama}</div>
                    </div>
                </div>

                <div style="background: #ffffff; border: 1px solid #f1ece1; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span style="font-size: 10.5px; color: #64748b; display: block;">Jarak Rute</span>
                        <b style="font-size: 18px; color: #0f172a;">${currentRouteDistanceKm} KM</b>
                    </div>
                    <div style="text-align: right;">
                        <span style="font-size: 10.5px; color: #64748b; display: block;">Waktu Tempuh</span>
                        <b style="font-size: 18px; color: #ea580c;">&plusmn; ${durasiMnt} mnt</b>
                    </div>
                </div>

                <div class="detail-action-buttons" style="margin-top: 10px;">
                    <button class="btn-orange-rute" style="background: #dc2626;" onclick="akhiriNavigasi()">
                        <i class="fa-solid fa-circle-stop"></i> Akhiri Navigasi
                    </button>
                </div>
            `;

            if ("geolocation" in navigator) {
                navigationInterval = navigator.geolocation.watchPosition(
                    (pos) => {
                        userLocation = [pos.coords.latitude, pos.coords.longitude];
                        if (userMarker) userMarker.setLatLng(userLocation);
                        map.panTo(userLocation);
                    },
                    (err) => console.warn(err),
                    { enableHighAccuracy: true }
                );
            }
        }

        function akhiriNavigasi() {
            if (navigationInterval) {
                navigator.geolocation.clearWatch(navigationInterval);
                navigationInterval = null;
            }
            hapusRuteNavigasi();
        }

        function buatGarisLurusFallback(startLat, startLng, destLat, destLng, item) {
            currentRouteDistanceKm = parseFloat(hitungJarakKm(startLat, startLng, destLat, destLng));
            if (routePolyline) map.removeLayer(routePolyline);
            routePolyline = L.polyline([[startLat, startLng], [destLat, destLng]], {
                color: '#dc2626', weight: 4, dashArray: '6, 6'
            }).addTo(map);
            map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
            tampilkanPanelRuteNavigasi();
        }

        function hapusRuteNavigasi() {
            if (navigationInterval) {
                navigator.geolocation.clearWatch(navigationInterval);
                navigationInterval = null;
            }
            if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
            if (singleTargetMarker) { map.removeLayer(singleTargetMarker); singleTargetMarker = null; }
            currentActiveItem = null;
            renderMarkers();
            renderListView();
        }

        function hapusRuteNavigasiTanpaList() {
            if (navigationInterval) {
                navigator.geolocation.clearWatch(navigationInterval);
                navigationInterval = null;
            }
            if (routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
            if (singleTargetMarker) { map.removeLayer(singleTargetMarker); singleTargetMarker = null; }
            renderMarkers();
        }

        function hapusRuteDanBukaDetail(item) {
            hapusRuteNavigasiTanpaList();
            renderDetailView(item);
        }

        function renderNoResultView() {
            const container = document.getElementById('leftCardBody');
            container.innerHTML = `
                <div class="no-result-box">
                    <div class="no-result-title">Tidak ada UMKM yang sesuai</div>
                    <div class="no-result-sub">Coba kata kunci lain atau ubah filter wilayah.</div>
                    <button class="btn-reset-search" onclick="resetPencarian()">Hapus pencarian</button>
                </div>
            `;
        }

        function resetPencarian() {
            document.getElementById('mainSearchInput').value = '';
            document.getElementById('kecamatanSelect').value = 'Semua';
            document.getElementById('kelurahanSelect').value = 'Semua';
            document.getElementById('radiusSelect').value = '0';
            activeKategori = 'Semua';
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            highlightBoundaryLayer.clearLayers();
            filterSemuaData();
        }

        function renderStatistik() {
            const total = (activePOV === 'pengunjung') ? filteredUmkmData.length : rawUmkmData.length;
            const kec = document.getElementById('kecamatanSelect').value;
            
            document.getElementById('statSelectedTotal').innerText = total;
            document.getElementById('statAreaName').innerText = (kec === 'Semua') ? 'Kota Bogor' : kec;

            const katCounts = { 'Kuliner': 0, 'Jasa': 0, 'Fashion': 0, 'Teknologi': 0, 'Kerajinan': 0 };
            const dataset = (activePOV === 'pengunjung') ? filteredUmkmData : rawUmkmData;

            dataset.forEach(f => {
                const k = ((f.properties || {}).kategori || '').toLowerCase();
                for (let key in katCounts) {
                    if (k.includes(key.toLowerCase())) katCounts[key]++;
                }
            });

            let catHtml = '';
            for (let k in katCounts) {
                const cnt = katCounts[k];
                const pct = total > 0 ? ((cnt / total) * 100).toFixed(0) : 0;
                const color = getWarnaKategori(k);
                catHtml += `
                    <div class="stat-bar-item">
                        <div class="stat-bar-label">
                            <span>&bull; ${k}</span>
                            <b>${cnt}</b>
                        </div>
                        <div class="stat-progress-bg">
                            <div class="stat-progress-fill" style="width:${pct}%; background:${color};"></div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('statCategoryBars').innerHTML = catHtml;
        }

        function toggleStatistik() {
            const el = document.getElementById('rightStatCard');
            el.style.display = (el.style.display === 'none' || el.style.display === '') ? 'flex' : 'none';
        }

        function toggleMapLayer(layerName) {
            if (layerName === 'umkm') {
                if (document.getElementById('layerUmkm').checked) map.addLayer(umkmLayerGroup);
                else map.removeLayer(umkmLayerGroup);
            } else if (layerName === 'admin' && adminBoundaryLayer) {
                if (document.getElementById('layerAdmin').checked) {
                    map.addLayer(adminBoundaryLayer);
                    map.addLayer(highlightBoundaryLayer);
                } else {
                    map.removeLayer(adminBoundaryLayer);
                    map.removeLayer(highlightBoundaryLayer);
                }
            } else if (layerName === 'jalan') {
                if (document.getElementById('layerJalan').checked) map.addLayer(jalanLayer);
                else map.removeLayer(jalanLayer);
            } else if (layerName === 'sekolah') {
                if (document.getElementById('layerSekolah').checked) map.addLayer(sekolahLayer);
                else map.removeLayer(sekolahLayer);
            } else if (layerName === 'permukiman') {
                if (document.getElementById('layerPermukiman').checked) map.addLayer(permukimanLayer);
                else map.removeLayer(permukimanLayer);
            }
        }
    </script>
</body>
</html>
